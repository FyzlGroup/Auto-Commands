<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="referrer" content="no-referrer">

  <title>FyzlGroup AutoCommands</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7f7f7;
    }

    #loanFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f7f7f7;
    }
  </style>
</head>

<body>

  <iframe
    id="loanFrame"
    title="Fyzl Group Auto Commands"
    referrerpolicy="no-referrer"
    allow="fullscreen"
  ></iframe>

  <script>
    "use strict";

    const WEB_APP =
      "https://script.google.com/a/macros/fyzlgroup.com/s/AKfycbyE2F2s004qPt2Mny-UFM3ck12GgEMLEzF-JY8AGOrPgS7yz_oc9e8JFiL1zJ5mLAA/exec";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const iframeUrl = new URL(WEB_APP);

    if (token) {
      iframeUrl.searchParams.set("token", token);
    }

    document.getElementById("loanFrame").src = iframeUrl.toString();
  </script>

</body>
</html>
